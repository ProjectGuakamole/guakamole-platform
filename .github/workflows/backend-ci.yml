name: Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
      - "spike/**"
  pull_request:
    branches:
      - main

jobs:
  backend-quality:
    name: Ruff, mypy y pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: guakamole_db
          POSTGRES_USER: guakamole_user
          POSTGRES_PASSWORD: guakamole_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guakamole_user -d guakamole_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://guakamole_user:guakamole_test_password@localhost:5432/guakamole_db
      TEST_DATABASE_URL: postgresql+psycopg://guakamole_user:guakamole_test_password@localhost:5432/guakamole_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: uv sync --all-groups

      - name: Aplicar migraciones Alembic
        run: uv run alembic upgrade head

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy strict
        run: uv run mypy --strict .

      - name: Pytest
        run: uv run pytest
